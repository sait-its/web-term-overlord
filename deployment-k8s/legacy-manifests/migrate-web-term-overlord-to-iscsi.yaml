apiVersion: v1
kind: Pod
metadata:
  name: web-term-overlord-pvc-migrate
  namespace: sandbox-overlord
spec:
  restartPolicy: Never
  containers:
    - name: migrate
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Old data:"
          ls -la /old/apps/web-term-overlord || true

          echo "Copying logs.db into new iSCSI PVC..."
          cp /old/apps/web-term-overlord/logs.db /new/logs.db
          sync

          echo "New data:"
          ls -la /new
          du -sh /old/apps/web-term-overlord /new || true

          echo "Done. Sleeping for inspection."
          sleep 3600
      volumeMounts:
        - name: old-data
          mountPath: /old
          readOnly: true
        - name: new-data
          mountPath: /new
  volumes:
    - name: old-data
      persistentVolumeClaim:
        claimName: apps-web-term-overlord-pvc
    - name: new-data
      persistentVolumeClaim:
        claimName: apps-web-term-overlord-iscsi-pvc
