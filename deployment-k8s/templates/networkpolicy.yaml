{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.name }}
  namespace: {{ include "overlord.namespace" . }}
  labels:
    {{- include "overlord.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.backend.app }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.frontend.app }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
  egress: []
{{- end }}
